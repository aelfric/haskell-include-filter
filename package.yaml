name:                include-filter
version:             0.1.0.0
github:              "aelfric/haskell-include-filter"
license:             BSD3
author:              "Author name here"
maintainer:          "F.Riccobono@gmail.com"
copyright:           "2026 Frank Riccobono"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/aelfric/haskell-include-filter#readme>

dependencies:
- base >= 4.7 && < 5
- text
- pandoc
- pandoc-types
- ghcid
- containers

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: app/includer
  exposed-modules: IncludeFilter

executables:
  include-filter-exe:
    main:                Main.hs
    source-dirs:         app/includer
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - include-filter

  sms-links:
    main:                Main.hs
    source-dirs:         app/linker
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - include-filter
tests:
  include-filter-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hspec
    - temporary
    - include-filter
